<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thing Dem Work – Lyric Export</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--red:#ff1f3d;--gold:#ffc928;--white:#ffffff;--black:#050505;--card:#141414}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--black);color:var(--white);font-family:Arial,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 30px)}
h1{font-family:'Anton',Impact,sans-serif;font-size:34px;letter-spacing:.05em;text-shadow:3px 3px 0 var(--red)}
h1 span{color:var(--gold)}
#status{margin:10px 0 20px;font-size:14px;opacity:.9}
.card{background:var(--card);border-left:5px solid var(--gold);padding:14px;margin-bottom:18px}
.card h2{font-family:'Anton',Impact,sans-serif;font-size:22px;letter-spacing:.05em;color:var(--gold)}
.card p{font-size:13px;opacity:.8;margin:4px 0 10px}
textarea{width:100%;height:170px;background:#000;color:var(--white);border:1px solid #333;font-family:monospace;font-size:12px;padding:8px}
.btns{display:flex;gap:10px;margin-top:10px}
button{flex:1;font-family:'Anton',Impact,sans-serif;font-size:17px;letter-spacing:.08em;padding:12px;border:none;cursor:pointer;background:var(--gold);color:var(--black)}
button.alt{background:var(--red);color:var(--white)}
</style>
</head>
<body>
<h1>THING DEM WORK <span>EXPORT</span></h1>
<div id="status"></div>
<div id="cards"></div>

<script src="lyrics.js"></script>
<script src="times.js"></script>
<script>
const ARTIST = "BAZRAGOD";
const TITLE = "Thing Dem Work";

const SHEET_LINES = (typeof SHEET !== 'undefined' ? SHEET : []);
const LINES = SHEET_LINES.filter(l => l.trim() !== "");
const T = (typeof TIMES !== 'undefined' && Array.isArray(TIMES)) ? TIMES : [];
const timed = Math.min(T.length, LINES.length);

let msg;
if (timed === LINES.length && T.length === LINES.length) msg = `All ${LINES.length} lines timed ✓`;
else if (T.length > LINES.length) msg = `times.js has ${T.length} timings but there are ${LINES.length} lines. Re-sync on the lyric page.`;
else msg = `${timed} of ${LINES.length} lines timed. Finish SYNC LYRICS on the lyric page for full SRT/LRC files. Plain lyrics work now.`;
document.getElementById('status').textContent = msg;

function endOf(i) {
  const next = T[i + 1];
  const cap = T[i] + 8;
  let e = (next !== undefined && i + 1 < timed) ? Math.min(next, cap) : T[i] + 4;
  return Math.max(e, T[i] + 0.5);
}

function srtTime(s) {
  const ms = Math.round(s * 1000);
  const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60,
        sec = Math.floor(ms / 1000) % 60, r = ms % 1000;
  const p = (n, l = 2) => String(n).padStart(l, '0');
  return `${p(h)}:${p(m)}:${p(sec)},${p(r, 3)}`;
}

function lrcTime(s) {
  const m = Math.floor(s / 60), sec = (s % 60).toFixed(2).padStart(5, '0');
  return `[${String(m).padStart(2, '0')}:${sec}]`;
}

function shortTime(s) {
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${String(sec).padStart(2, '0')}`;
}

function makeSRT() {
  let out = [];
  for (let i = 0; i < timed; i++) {
    out.push(`${i + 1}\n${srtTime(T[i])} --> ${srtTime(endOf(i))}\n${LINES[i]}\n`);
  }
  return out.join('\n');
}

function makeLRC() {
  let out = [`[ar:${ARTIST}]`, `[ti:${TITLE}]`, `[by:${ARTIST}]`];
  for (let i = 0; i < timed; i++) {
    out.push(lrcTime(T[i]) + LINES[i]);
    const e = endOf(i), next = T[i + 1];
    if (next === undefined || i + 1 >= timed || e < next - 0.05) out.push(lrcTime(e));
  }
  return out.join('\n');
}

function makeTXT() {
  return `${TITLE} – ${ARTIST}\n\n` + SHEET_LINES.join('\n') + `\n\nWritten by ${ARTIST}`;
}

function makeList() {
  let out = [`${TITLE} – ${ARTIST}`, ''];
  for (let i = 0; i < timed; i++) out.push(`${shortTime(T[i])} – ${LINES[i]}`);
  out.push('', `Written by ${ARTIST}`);
  return out.join('\n');
}

function save(name, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = name;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

const formats = [
  { title: 'YouTube Studio (SRT)', note: 'Studio → Subtitles → Add → Upload file → With timing.', file: 'thing-dem-work.srt', make: makeSRT, needsTime: true },
  { title: 'Lyric Sites / Players (LRC)', note: 'Standard synced-lyrics format.', file: 'thing-dem-work.lrc', make: makeLRC, needsTime: true },
  { title: 'Plain Lyrics (TXT)', note: 'Clean lyric sheet with your verse/hook blocks.', file: 'thing-dem-work-lyrics.txt', make: makeTXT, needsTime: false },
  { title: 'Timed List (TXT)', note: 'Quick reference sheet with every line\'s start time.', file: 'thing-dem-work-timed.txt', make: makeList, needsTime: true }
];

const cards = document.getElementById('cards');
formats.forEach(f => {
  const text = (f.needsTime && !timed) ? '' : f.make();
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>${f.title}</h2><p>${f.note}</p><textarea readonly></textarea>
    <div class="btns"><button class="copy">COPY</button><button class="alt saveb">SAVE FILE</button></div>`;
  const ta = card.querySelector('textarea');
  ta.value = text || 'Sync your lyrics first to generate this.';
  card.querySelector('.copy').onclick = async e => {
    if (!text) return;
    try { await navigator.clipboard.writeText(text); }
    catch (err) { ta.select(); document.execCommand('copy'); }
    e.target.textContent = 'COPIED ✓';
  };
  card.querySelector('.saveb').onclick = () => { if (text) save(f.file, text); };
  cards.appendChild(card);
});
</script>
</body>
</html>
